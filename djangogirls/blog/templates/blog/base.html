{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Django Girls blog</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/blog.css' %}">
</head>
<body>
<header class="page-header">
    <div class="container">
        {% if user.is_authenticated %}
            <a href="{% url 'post_new' %}" class="top-menu">
                + New post
            </a>
            <a href="{% url 'post_draft_list' %}" class="top-menu">Drafts</a>
            <p id="logout" class="top-menu">
    Hello {{ user.username }}
    <small>
        <form method="post" action="{% url 'logout' %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit" style="background:none; border:none; color:#ffffff; padding:0; font-size:15pt; cursor:pointer;">
                (Log out)
            </button>
        </form>
    </small>
</p>
        {% else %}
            <a href="{% url 'login' %}" class="top-menu">Log in</a>
        {% endif %}
        <h1><a href="/">Django Girls Blog</a></h1>
    </div>
</header>
    </header>
    <main class="container">
        <div class="row">
            <div class="col">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </main>
</body>
</html>
