<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Student Information Form</title>
    <style>
        body { font-family: Segoe UI, Arial, sans-serif; max-width: 600px; margin: 40px auto; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input[type="text"], input[type="number"], select, textarea {
            width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box;
        }
        .error { color: red; font-weight: bold; margin-bottom: 10px; }
        button { margin-top: 16px; padding: 8px 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Student Information Form</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label for="name">Student Name:</label>
        <input type="text" id="name" name="name" value="{{ name|default:'' }}">

        <label for="student_id">Student ID:</label>
        <input type="text" id="student_id" name="student_id" value="{{ student_id|default:'' }}">

        <label for="major">Major:</label>
        <select id="major" name="major">
            <option value="Computer Science">Computer Science</option>
            <option value="Information Technology">Information Technology</option>
            <option value="Cybersecurity">Cybersecurity</option>
            <option value="Software Engineering">Software Engineering</option>
            <option value="Data Science">Data Science</option>
        </select>

        <label>Class Standing:</label>
        <label><input type="radio" name="standing" value="Freshman"> Freshman</label>
        <label><input type="radio" name="standing" value="Sophomore"> Sophomore</label>
        <label><input type="radio" name="standing" value="Junior"> Junior</label>
        <label><input type="radio" name="standing" value="Senior"> Senior</label>

        <label>Programming Languages Known:</label>
        <label><input type="checkbox" name="languages" value="Python"> Python</label>
        <label><input type="checkbox" name="languages" value="Java"> Java</label>
        <label><input type="checkbox" name="languages" value="JavaScript"> JavaScript</label>
        <label><input type="checkbox" name="languages" value="C++"> C++</label>
        <label><input type="checkbox" name="languages" value="C#"> C#</label>

        <label for="grad_year">Expected Graduation Year:</label>
        <input type="number" id="grad_year" name="grad_year" min="2024" max="2035">

        <label for="comments">Comments:</label>
        <textarea id="comments" name="comments" rows="4"></textarea>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
